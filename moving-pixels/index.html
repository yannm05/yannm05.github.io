<style>
/* Layout: one narrow phone column on a night-map ground. The data pixels are the only bright colour; everything else stays quiet. Single dark look by choice. */
:root {
  color-scheme: dark;
  --night: #0E1726;
  --panel: #18243A;
  --panel-2: #213049;
  --line: #34466A;
  --text: #F2F5FA;
  --muted: #AEBBCE;
  --brand: #2553E6;
  --brand-hi: #4F78F5;
  --gain: #3F9DE3;
  --loss: #F08A3C;
  --ok: #3CCB8F;
  --bad: #FF8080;
  --font-display: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--text); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 28px; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .03em; white-space: nowrap; flex: none; background: none; border: 0; color: var(--text); padding: 8px 8px 8px 0; min-height: 44px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wordmark.ask { color: var(--loss); }
.wordmark:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.pips { display: flex; gap: 4px; flex: 1 1 0; min-width: 0; justify-content: center; }
.pips i { width: 12px; height: 12px; flex: 0 1 12px; min-width: 0; background: var(--panel-2); }
.pips i.done { background: var(--gain); }
.pips i.now { background: var(--text); }
.score { font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }

h1, h2 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.3rem, 11.5vw, 3.4rem); line-height: 1; white-space: nowrap; letter-spacing: .01em; }
h2 { font-size: 1.32rem; line-height: 1.22; font-weight: 700; }
.lead { color: var(--muted); font-size: 1.05rem; }
.bridge { color: var(--gain); font-weight: 700; font-size: .95rem; }
.small { font-size: .84rem; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }

canvas.map { image-rendering: pixelated; display: block; width: 100%; max-width: min(100%, 45vh); margin: 0 auto; aspect-ratio: 1; touch-action: manipulation; }
canvas.world { display: block; width: 100%; max-width: 100%; aspect-ratio: 360 / 127; }

.btn { font: 700 1.02rem/1.2 var(--font-body); color: var(--text); background: var(--panel); border: 2px solid var(--line); padding: 14px 12px; min-height: 52px; cursor: pointer; text-align: center; border-radius: 3px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.btn.primary { background: var(--brand); border-color: var(--brand-hi); color: #FFFFFF; }
.btn.right { background: #123F31; border-color: var(--ok); }
.btn.wrong { background: #4A2230; border-color: var(--bad); }
.btn:disabled { cursor: default; }
.btn.dim { opacity: .5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.wide { width: 100%; }

.sharpen { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.worth { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.worth small { font-family: var(--font-body); font-size: .82rem; font-weight: 400; color: var(--muted); }
.sharpen .btn { min-height: 44px; padding: 6px 14px; line-height: 1.2; }
.sharpen .btn .small { font-weight: 400; }

.reveal { background: var(--panel); border-top: 4px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.reveal.good { border-top-color: var(--ok); }
.reveal.miss { border-top-color: var(--bad); }
.verdict { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-weight: 700; font-size: 1.14rem; }
.verdict b { font-size: 1.3rem; white-space: nowrap; }
.good .verdict b { color: var(--ok); }
.miss .verdict b { color: var(--bad); }
.source { font-size: .76rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 13px; height: 13px; display: inline-block; }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) 5.2rem; align-items: center; gap: 8px; font-size: .88rem; }
.bar .tr { position: relative; height: 16px; background: var(--panel-2); }
.bar .fl { position: absolute; top: 0; bottom: 0; background: var(--muted); }
.bar .fl.top { background: var(--gain); }
.bar .fl.neg { background: var(--loss); }
.bar .zero { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }

.hz { display: flex; align-items: center; gap: 10px; justify-content: flex-start; text-align: left; padding-inline: 10px; }
.hz svg { width: 26px; height: 26px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.cardzone { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.mythcard { background: var(--panel-2); border: 2px solid var(--line); padding: 26px 18px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 10px; cursor: grab; }
.quote { font-weight: 700; }
.mythcard q { font-size: 1.4rem; font-weight: 700; line-height: 1.25; quotes: "\201C" "\201D"; }
.swipehint { display: flex; justify-content: space-between; font-size: .84rem; color: var(--muted); }

.paint { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; touch-action: none; max-width: min(100%, 42vh); margin: 0 auto; width: 100%; cursor: crosshair; }
.paint i { aspect-ratio: 1; background: var(--panel-2); display: block; }
.paint i.on { background: var(--text); }
.paint i.mine { outline: 2px solid var(--muted); outline-offset: -2px; background: transparent; }
.paint i.truth { background: var(--loss); }
.bigval { font-family: var(--font-body); font-weight: 700; font-size: 2.3rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.bigval small { font-family: var(--font-body); font-size: .95rem; font-weight: 400; color: var(--muted); }
input[type="range"] { width: 100%; height: 40px; accent-color: var(--brand-hi); }
.tick { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }

table.sc { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.sc th { font-size: .76rem; color: var(--muted); font-weight: 400; text-align: right; padding: 0 0 4px 6px; }
.sc td { padding: 6px 0 6px 6px; text-align: right; border-top: 1px solid var(--line); }
.sc th:first-child, .sc td:first-child { text-align: left; padding-left: 0; }
.sc tr.hit td { font-weight: 700; color: var(--text); }
.sc td.max { color: var(--loss); font-weight: 700; }

.final { font-family: var(--font-body); font-weight: 700; font-size: clamp(3.4rem, 19vw, 5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.final small { font-size: 1.2rem; color: var(--muted); }
.rank { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--gain); }
ul.learn { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.learn li { padding-left: 18px; position: relative; }
ul.learn li::before { content: ""; position: absolute; left: 0; top: .42em; width: 9px; height: 9px; background: var(--gain); }
.board { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.board li { display: grid; grid-template-columns: 1.7rem 1fr auto; gap: 6px; padding: 7px 8px; font-variant-numeric: tabular-nums; }
.board li.me { background: var(--panel-2); font-weight: 700; }
.board b { font-weight: 700; }
label.lab { font-size: .9rem; color: var(--muted); display: block; margin-bottom: 4px; }
.name { width: 100%; font: 700 1.05rem var(--font-body); color: var(--text); background: var(--panel); border: 2px solid var(--line); padding: 12px; border-radius: 3px; }
select.name { text-overflow: ellipsis; min-width: 0; }
details.priv { border: 1px solid var(--line); padding: 0 12px; }
details.priv summary { cursor: pointer; font-weight: 700; padding: 12px 0; min-height: 44px; }
details.priv summary:focus-visible, select:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
details.priv .stack { gap: 10px; padding-bottom: 12px; }
.board small { display: block; font-size: .78rem; color: var(--muted); font-weight: 400; overflow-wrap: anywhere; }
.board span { min-width: 0; }
.board li.wait { opacity: .7; }
a.link { color: var(--text); font-weight: 700; }
.flag { font-size: .76rem; color: var(--muted); border: 1px solid var(--line); padding: 6px 8px; }
.wrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; }
canvas.wmini { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
.wcount { font-size: 1.25rem; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.wtest { min-height: 1.5em; font-size: .92rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.wsay { font-size: 1.08rem; font-weight: 700; font-variant-numeric: tabular-nums; }
canvas.g3d { touch-action: pan-y; cursor: grab; image-rendering: auto; }
canvas.g3d.half { max-width: min(100%, 31vh); }
.tile { display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; padding: 10px 8px; }
.tile .small { font-weight: 400; line-height: 1.25; }
.gridwide { grid-column: 1 / -1; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
.cmp b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.whogrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; max-width: min(100%, 42vh); margin: 0 auto; width: 100%; }
.whogrid i, i.pp { aspect-ratio: 1; display: block; background: var(--panel-2); clip-path: polygon(36% 0, 64% 0, 64% 28%, 84% 28%, 84% 66%, 68% 66%, 68% 100%, 54% 100%, 54% 70%, 46% 70%, 46% 100%, 32% 100%, 32% 66%, 16% 66%, 16% 28%, 36% 28%); }
.whogrid i.stay, i.pp.stay { background: var(--text); }
.whogrid i.left, i.pp.left { background: var(--loss); opacity: .6; animation: wholeave .35s ease-out; }
.whogrid i.came, i.pp.came { background: var(--gain); animation: whocome .35s ease-out; }
i.pp { width: 15px !important; height: 15px !important; animation: none !important; }
@keyframes wholeave { from { transform: translateY(-5px) scale(1.25); opacity: 1; } to { transform: none; opacity: .6; } }
@keyframes whocome { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.sc tr.net td { font-weight: 700; color: var(--text); }
.fan { display: block; width: 100%; touch-action: pan-y; }
.fan text { font-family: var(--font-body); }
.fan.drawing { touch-action: none; cursor: crosshair; }
.fan .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: fandraw 1.1s ease-out forwards; }
@keyframes fandraw { to { stroke-dashoffset: 0; } }
.sc td.pick, .sc th.pick { color: var(--text); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .fan .draw { animation: none; stroke-dashoffset: 0; } .whogrid i { animation: none !important; } }
.hook { font-size: 1.32rem; font-weight: 700; line-height: 1.2; text-align: center; text-wrap: balance; }
.teaser { min-height: 2.8em; text-align: center; color: var(--muted); transition: opacity .35s; display: flex; align-items: center; justify-content: center; text-wrap: balance; }
.teaser.out { opacity: 0; }
.btn.go { animation: gopulse 2.2s ease-in-out infinite; }
@keyframes gopulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(79, 120, 245, .55); } 50% { box-shadow: 0 0 0 10px rgba(79, 120, 245, 0); } }
.battle { background: var(--panel); border: 2px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.battle h2 { font-size: 1.05rem; }
.battle .board li { padding: 6px 4px; }
.more summary { cursor: pointer; font-weight: 700; padding: 12px 0; min-height: 44px; text-align: center; color: var(--text); }
.more summary:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.more > .stack { padding-top: 4px; }
@media (prefers-reduced-motion: reduce) { .btn.go { animation: none; } .teaser { transition: none; } }
.fxlayer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; pointer-events: none; }
.hero { display: block; width: 100%; max-width: min(100%, 38vh); margin: 0 auto; aspect-ratio: 1; }
.space { background:
  radial-gradient(circle at 50% 50%, rgba(63, 157, 227, .30) 0%, rgba(63, 157, 227, .14) 40%, rgba(63, 157, 227, 0) 56%),
  radial-gradient(1.5px 1.5px at 12% 18%, #FFF, transparent), radial-gradient(1px 1px at 82% 12%, #FFF, transparent), radial-gradient(1.5px 1.5px at 92% 58%, #CFE3FF, transparent),
  radial-gradient(1px 1px at 6% 72%, #FFF, transparent), radial-gradient(1px 1px at 22% 92%, #CFE3FF, transparent), radial-gradient(1.5px 1.5px at 74% 90%, #FFF, transparent),
  radial-gradient(1px 1px at 48% 5%, #FFF, transparent), radial-gradient(1px 1px at 96% 30%, #FFF, transparent), radial-gradient(1px 1px at 3% 40%, #CFE3FF, transparent); }
.btn.big { font-size: 1.2rem; min-height: 62px; }
.btn.ghost { background: transparent; border-color: transparent; font-weight: 400; color: var(--muted); min-height: 44px; padding: 6px; text-decoration: underline; }
.explored { display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--muted); }
.explored .pips i { width: 12px; height: 12px; }
.explored .pips { flex: none; justify-content: flex-start; }
.badge { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 2px solid var(--line); padding: 10px 12px; }
.badge svg { width: 42px; height: 42px; flex: none; }
.badge b { display: block; font-size: 1.02rem; }
.twscene { display: block; width: 100%; aspect-ratio: 180 / 92; image-rendering: pixelated; }
.twcount { font-size: .78rem; color: var(--muted); }
.gpick { min-height: 1.5em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
canvas.paintmap { touch-action: none; cursor: crosshair; }
.brushes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.brushes .btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
.brushes .btn i { width: 18px; height: 18px; display: block; flex: none; }
.brushes .btn.on { border-color: var(--text); background: var(--panel-2); }
.btn.tab.on { border-color: var(--text); background: var(--panel-2); }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tabs .btn { min-height: 46px; padding: 6px 2px; font-size: .92rem; }
.ffcard { background: var(--panel-2); border: 2px solid var(--line); padding: 24px 18px; min-height: 190px; display: flex; align-items: center; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.ffcard q { font-size: 1.32rem; font-weight: 700; line-height: 1.28; quotes: "\201C" "\201D"; }
.ffcard.good { border-color: var(--ok); }
.ffcard.bad { border-color: var(--bad); }
.fflist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.fflist li { border-left: 4px solid var(--line); padding-left: 10px; }
.fflist b { display: block; }
.whogrid.ten { grid-template-columns: repeat(10, minmax(0, 1fr)); max-width: min(100%, 36vh); }
.twcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.twc { position: relative; overflow: hidden; background: var(--panel); border: 2px solid var(--line); padding: 6px 8px; }
.twc.block { border-color: var(--bad); }
.twin { position: relative; }
.twname { font-weight: 700; font-size: .95rem; }
.twmoney { font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.twunit { font-size: .76rem; color: var(--muted); }
.twmoves { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.twpair { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.twpair .btn { min-height: 50px; padding: 6px 2px; font-size: .9rem; }
.twfacts td, .twfacts th { text-align: left !important; }
.twfacts td:first-child { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .btn:active:not(:disabled) { transform: none; } }
</style>

</div>

/* ---------- pixel maps ---------- */
function prepMap(cv, lv) {
  const S = 768, ctx = cv.getContext('2d');
  cv.width = S; cv.height = S;
  const step = S / lv.n, ox = (S - lv.c * step) / 2, oy = (S - lv.r * step) / 2;
  const gap = lv.n <= 16 ? 3 : 0;
  const cells = [];
  for (let i = 0; i < lv.s.length; i++) if (lv.s[i] !== '.') cells.push(i);
  const paint = i => {
    const x = i % lv.c, y = (i - x) / lv.c;
    ctx.fillStyle = COL[+lv.s[i]];
    ctx.fillRect(ox + x * step, oy + y * step, Math.ceil(step) - gap, Math.ceil(step) - gap);
  };
  return { cells, paint };
}
// Paints order[from..to) a few pixels at a time, so new pixels appear to arrive.
function paintRange(paint, order, from, to) {
  if (REDUCED) { for (let k = from; k < to; k++) paint(order[k]); return; }
  const per = Math.ceil((to - from) / 12);
  let k = from;
  (function frame() {
    for (let e = Math.min(to, k + per); k < e; k++) paint(order[k]);
    if (k < to) requestAnimationFrame(frame);
  })();
}
function drawLevel(cv, lv) {
  const m = prepMap(cv, lv), order = shuffle(m.cells);
  paintRange(m.paint, order, 0, order.length);
}
function drawWorld(cv, w) {
  const scale = 3, W = w.c * scale, H = w.r * scale, ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;

  const paint = i => { const x = i % w.c, y = (i - x) / w.c; ctx.fillStyle = COL[+w.s[i]]; ctx.fillRect(x * scale, y * scale, scale, scale); };

  const order = shuffle(cells), frames = 40, per = Math.ceil(order.length / frames);

}

/* ---------- look and feel: pixel dissolve, bursts, count-ups, badges ---------- */
// Every new screen appears through a field of dissolving pixels. Started by a watcher on #screen, so no screen has to ask for it.
function pixelDissolve() {
  if (REDUCED) return;
  const old = document.getElementById('fxd'); if (old) old.remove();
  const cv = document.createElement('canvas'); cv.id = 'fxd'; cv.className = 'fxlayer';
  const W = innerWidth, H = innerHeight, S = 36, list = [], ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  for (let r = 0; r * S < H; r++) for (let c = 0; c * S < W; c++) {
    ctx.fillStyle = Math.random() < .1 ? COL[Math.random() * 7 | 0] : '#0E1726';
    ctx.fillRect(c * S, r * S, S, S);
    list.push([c * S, r * S]);
  }
  document.body.appendChild(cv);
  const order = shuffle(list), per = Math.ceil(order.length / 12);
  let k = 0;
  (function step() {
    for (const e = Math.min(order.length, k + per); k < e; k++) ctx.clearRect(order[k][0], order[k][1], S, S);
    if (k < order.length) setTimeout(step, 22); else cv.remove();
  })();
}
function pixelBurst(el) {
  try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { /* not available */ }
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = Math.max(70, Math.min(innerHeight - 70, r.top + 30));
  const cv = document.createElement('canvas'); cv.className = 'fxlayer'; cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext('2d');
  document.body.appendChild(cv);
  const bits = Array.from({ length: 48 }, () => { const a = Math.random() * 6.283, v = 3 + Math.random() * 7; return { x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, c: COL[[0, 1, 4, 5, 6][Math.random() * 5 | 0]], s: 5 + (Math.random() * 5 | 0) }; });
  let n = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalAlpha = Math.max(0, 1 - n / 30);
    for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += .35; ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.s, b.s); }
    if (++n < 30) setTimeout(step, 24); else cv.remove();
  })();
}
function countUp(el, from, to, ms) {
  if (!el) return;
  if (REDUCED || from === to) { el.textContent = to; return; }
  const t0 = performance.now();

    if (!el.isConnected) return;
    const u = Math.min(1, (performance.now() - t0) / (ms || 500));
    el.textContent = Math.round(from + (to - from) * u);
    if (u < 1) setTimeout(step, 30);
  })();
}

    copy.width = map.width; copy.height = map.height; copy.getContext('2d').drawImage(map, 0, 0);
    copy.className = 'fxlayer';
    copy.style.cssText = `left:${a.left}px;top:${a.top}px;inset:auto;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;transform-origin:50% 50%;transition:transform .85s cubic-bezier(.5,0,.2,1),opacity .85s ease-in`;
    document.body.appendChild(copy);
    const tx = b.left + fx / world.width * b.width - (a.left + a.width / 2), ty = b.top + fy / world.height * b.height - (a.top + a.height / 2);
    setTimeout(() => { copy.style.transform = `translate(${tx}px,${ty}px) scale(.08)`; copy.style.opacity = '.35'; }, 30);
    setTimeout(() => { copy.remove(); mark(); }, 950);
  }, 420);
}

/* ---------- 1. mystery country: full detail from the start, only some pixels visible ---------- */

/* ---------- shared pieces for the question pools ---------- */
const pick = pool => G.v != null ? pool[G.v % pool.length] : pool[Math.random() * pool.length | 0];
const src = (rcp, yr) => `CLICME model scenario, not a forecast · ${rcp} · ${yr} · adults aged 20–80 · compared with a world without climate change`;
const per = v => (v < 0 ? '−' : '+') + (Math.abs(v) < .1 ? Math.abs(v).toFixed(2) : Math.abs(v).toFixed(1));
const C = iso => D.facts.c[iso];
const conBars = () => D.facts.con.map(c => ({ label: c.name, v: c.net })).sort((a, b) => b.v - a.v);
const perBars = isos => isos.map(i => ({ label: C(i).name, v: C(i).pct, t: per(C(i).pct) })).sort((a, b) => b.v - a.v);
const hazBars = vals => HAZ.map((h, k) => ({ label: h.name, v: vals[k] })).sort((a, b) => b.v - a.v);
const flowBars = c => [{ label: 'Moving out', v: -c.out }, { label: 'Moving in', v: c.in }, { label: 'Net change', v: c.net }];

function choiceRound(o) {
  const labels = o.keep ? o.opts : shuffle(o.opts);
  $('#screen').innerHTML = `
    <p class="bridge">${o.bridge}</p>
    <h2>${o.q}</h2>
    ${o.note ? `<p class="small">${o.note}</p>` : ''}
    <div id="after" class="stack"><div class="grid2">${labels.map(l => `<button class="btn" type="button" data-o="${esc(l)}">${esc(l)}${o.sub && o.sub[l] ? `<br><span class="small">${esc(o.sub[l])}</span>` : ''}</button>`).join('')}</div></div>`;
  const answer = pickd => {
    const good = pickd === o.truth, p = good ? o.pts : 0;
    addScore(p);
    showReveal($('#after'), revealBox(p, good ? `Right: ${o.truth}` : `It was ${o.truth}`, good, o.body(), o.source));
    if (o.onReveal) o.onReveal();
  };
  document.querySelectorAll('#after .btn').forEach(b => { b.onclick = () => answer(b.dataset.o); });
  window.__auto = () => answer(o.truth);
}

/* ---------- 3. myth or fact (swipe) ---------- */

    body: () => `<p>Floods, sea-level rise and temperature set people moving. Damage to agriculture does the opposite: about ${people(-D.wh.m3hz[3])} fewer adults move, and ${people(D.wh.m4ag)} more never move at all.</p><p>Moving costs money. Losing your income can make it harder to leave.</p>` },
  { text: 'Damage to agriculture makes more people move.', myth: true, cap: 'Extra adults moving worldwide, by hazard', rows: () => hazBars(D.wh.m3hz),
    body: () => `<p>It is the only one of the four hazards that lowers movement: about ${people(-D.wh.m3hz[3])} fewer adults move, and ${people(D.wh.m4ag)} more never move at all.</p><p>Moving costs money. Losing your income can make it harder to leave.</p>` },
  { text: 'Floods set more people moving than sea-level rise.', myth: false, cap: 'Extra adults moving worldwide, by hazard', rows: () => hazBars(D.wh.m3hz),
    body: () => `<p>True in this scenario. It depends on the future, though: with strong emission cuts (RCP2.6), sea-level rise comes first, at ${people(D.facts.hz26[2])} against ${people(D.facts.hz26[1])} for floods.</p>` },
  { text: 'Every country in Africa loses adults.', myth: true, cap: 'Net change in adults', rows: () => ['CIV', 'UGA', 'RWA', 'MLI', 'NER'].map(i => ({ label: C(i).name, v: C(i).net })).sort((a, b) => b.v - a.v),
    body: () => `<p>Africa loses adults overall, but some of its countries are among the biggest gainers in the world. A continent can move in several directions at once.</p>` },
  { text: 'A country can have millions of people moving and almost no net change.', myth: false, cap: 'Indonesia: change in adults', rows: () => flowBars(C('IDN')),
    body: () => `<p>Arrivals and departures can cancel out. A small total can hide a lot of moves, so the net figure alone does not show how many people are affected.</p>` },
  { text: 'People only move away from poor countries.', myth: true, cap: 'United States: change in adults', rows: () => flowBars(C('USA')),
    body: () => `<p>The United States gains adults overall, but about ${people(C('USA').out)} also move out of their home area because of climate change.</p>` }
];
function roundMyth() {
  const m = pick(MYTHS);
  $('#screen').innerHTML = `
    <p class="bridge">Now test what you think you know.</p>
    <h2>Myth or fact?</h2>
    <div id="after" class="stack">
      <div class="cardzone"><div class="mythcard" id="card"><q>${esc(m.text)}</q></div></div>
      <div class="swipehint" aria-hidden="true"><span>← swipe for myth</span><span>swipe for fact →</span></div>
      <div class="grid2"><button class="btn" id="myth" type="button">Myth</button><button class="btn" id="fact" type="button">Fact</button></div>
    </div>`;
  let done = false;
  const answer = saidMyth => {
    if (done) return; done = true;
    const good = saidMyth === m.myth, p = good ? 100 : 0;
    addScore(p);
    const title = m.myth ? (good ? 'Myth! You saw through it' : "It's a myth") : (good ? 'Fact! Well spotted' : "It's a fact");
    showReveal($('#after'), revealBox(p, title, good, `<p class="quote">“${esc(m.text)}”</p><p class="small">${m.cap}</p>${barsHTML(m.rows())}${m.body()}`));

  const card = $('#card'); let sx = null, dx = 0;
  card.onpointerdown = e => { sx = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); };
  card.onpointermove = e => { if (sx === null) return; dx = e.clientX - sx; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; card.style.borderColor = dx < -40 ? 'var(--loss)' : dx > 40 ? 'var(--gain)' : ''; };
  card.onpointerup = card.onpointercancel = () => { if (sx === null) return; sx = null; if (dx < -70) answer(true); else if (dx > 70) answer(false); else { card.style.transform = ''; card.style.borderColor = ''; } };
  window.__auto = () => answer(m.myth);
}

  { q: 'Picture 100 adults in North America in 2090. How many move out of their home area because of climate change?', t: () => D.facts.conById.NAM.outp, source: src('RCP7.0', 2090),
    body: () => `<p>That is more than in Africa, at ${D.facts.conById.AFR.outp.toFixed(1)} in 100. North America also gains adults overall, about ${people(D.facts.conById.NAM.net)}.</p>` }
];
function roundHundred() {
  const v = pick(PAINTS), truth = v.t();
  $('#screen').innerHTML = `
    <p class="bridge">${G.rounds === QUICK ? 'Now from one country to the whole world.' : 'So how many people actually move?'}</p>
    <h2>${v.q}</h2>
    <div id="after" class="stack">
      <div class="paint" id="paint" role="img" aria-label="Grid of 100 adults">${Array.from({ length: 100 }, () => '<i></i>').join('')}</div>
      <div class="bigval"><span id="val">0</span> <small>out of 100</small></div>
      <label class="small" for="rng">Paint with your finger, or use the slider</label>
      <input type="range" id="rng" min="0" max="100" step="1" value="0">
      <button class="btn primary wide" id="lock" type="button">Lock it in</button>
    </div>`;
  const cells = [...document.querySelectorAll('#paint i')], rng = $('#rng');
  let val = 0;
  const set = n => { val = Math.max(0, Math.min(100, n)); rng.value = val; $('#val').textContent = val; cells.forEach((c, i) => c.classList.toggle('on', i < val)); };
  rng.oninput = () => set(+rng.value);
  const grid = $('#paint');
  const fromEvent = e => { const r = grid.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / r.width * 10), y = Math.floor((e.clientY - r.top) / r.height * 10); return Math.max(0, Math.min(9, y)) * 10 + Math.max(0, Math.min(9, x)) + 1; };
  let down = false;
  grid.onpointerdown = e => { down = true; grid.setPointerCapture(e.pointerId); const n = fromEvent(e); set(n === val ? n - 1 : n); };
  grid.onpointermove = e => { if (down) set(fromEvent(e)); };
  grid.onpointerup = grid.onpointercancel = () => { down = false; };
  const answer = g => {
    // Full marks for the nearest whole pixels, otherwise points fall with the ratio to the true value.
    const p = Math.abs(g - truth) <= .75 ? 150 : Math.round(150 * Math.exp(-Math.abs(Math.log((g + .5) / (truth + .5)))));
    addScore(p);
    grid.setAttribute('aria-label', `Grid of 100 adults: about ${truth.toFixed(1)} move, you guessed ${g}`);
    const whole = Math.floor(truth), frac = truth - whole;
    cells.forEach((c, i) => {
      c.className = '';
      if (i < g) c.classList.add('mine');
      if (i < whole) c.classList.add('truth');
      if (i === whole) c.style.background = `linear-gradient(90deg, var(--loss) ${frac * 100}%, var(--panel-2) 0)`;
    });
    $('#after').querySelectorAll('.bigval,label,input,#lock').forEach(n => n.remove());
    const box = document.createElement('div'); $('#after').appendChild(box);
    showReveal(box, revealBox(p, `About ${truth.toFixed(1)} in 100. You said ${g}.`, p >= 75,
      `<div class="legend"><span><i style="background:var(--loss)"></i>CLICME estimate</span>${g ? '<span><i style="outline:2px solid var(--muted);outline-offset:-2px"></i>Your guess</span>' : ''}</div>${v.body()}`, v.source));
  };
  $('#lock').onclick = () => answer(val);
  window.__auto = () => { set(12); answer(12); };
}

/* ---------- 6. which future? ---------- */
const FUT_BRIDGE = 'Does the future we choose change this?';
const FUT_LABEL = s => SCEN_LABEL[s];
function scenTable(hit) {
  const maxP = Math.max(...D.scen.map(s => s.p)), maxM = Math.max(...D.scen.map(s => s.m3));
  return `<table class="sc"><thead><tr><th>Future</th><th>Extra movers</th><th>Share of adults</th><th>Adults alive</th></tr></thead><tbody>${D.scen.map(s => `<tr class="${s.id === hit ? 'hit' : ''}"><td>${SCEN_TECH[s.id]}</td><td class="${s.m3 === maxM ? 'max' : ''}">${(s.m3 / 1e6).toFixed(0)} M</td><td class="${s.p === maxP ? 'max' : ''}">${s.p.toFixed(1)} %</td><td>${(s.t0 / 1e9).toFixed(1)} bn</td></tr>`).join('')}</tbody></table>`;
}
const scenOpts = () => ({ keep: true, opts: D.scen.map(s => FUT_LABEL(s.id)), sub: Object.fromEntries(D.scen.map(s => [FUT_LABEL(s.id), SCEN_TECH[s.id]])), note: 'Emission cuts, from strongest to none.' });
const by = k => D.scen.find(s => s.id === k);
const nearest = (opts, val) => opts.reduce((a, b) => Math.abs(b[1] - val) < Math.abs(a[1] - val) ? b : a)[0];
const FUTURES = [
  () => ({ ...scenOpts(), q: 'In which future do the most adults move because of climate change by 2090?', truth: FUT_LABEL('RCP70'),
    body: () => `${scenTable('RCP70')}<p>“No cuts” is the hottest future and moves the largest <b>share</b> of adults. But these scenarios also assume different populations, and “few cuts” has far more people, so it moves the most in total.</p><p>Strong cuts bring the share down from ${by('RCP85').p.toFixed(1)} % to ${by('RCP26').p.toFixed(1)} %. Choices matter.</p>` }),
  () => ({ ...scenOpts(), q: 'In which future does the largest share of adults move because of climate change by 2090?', truth: FUT_LABEL('RCP85'),
    body: () => `${scenTable('RCP85')}<p>The share rises with every step of warming. Strong cuts bring it down from ${by('RCP85').p.toFixed(1)} % to ${by('RCP26').p.toFixed(1)} %.</p><p>The total is highest under “few cuts”, because that scenario has far more people.</p>` }),
  () => { const cut = (1 - by('RCP26').p / by('RCP85').p) * 100, o = [['About 10% lower', 10], ['About 30% lower', 30], ['About 50% lower', 50], ['About 70% lower', 70]];
    return { keep: true, opts: o.map(x => x[0]), q: 'Compared with no emission cuts, how much do strong cuts lower the share of adults who move because of climate change by 2090?', truth: nearest(o, cut),
      body: () => `${scenTable('RCP26')}<p>The share falls from ${by('RCP85').p.toFixed(1)} % to ${by('RCP26').p.toFixed(1)} %, about ${Math.round(cut)}% lower. Choices matter.</p>` }; },
  () => { const ys = D.facts.years, ratio = ys[3].m3 / ys[1].m3, o = [['About 2 times', 2], ['About 4 times', 4], ['About 7 times', 7], ['About 20 times', 20]];
    return { keep: true, opts: o.map(x => x[0]), q: 'With few emission cuts, how many times more adults move because of climate change by 2090 than by 2050?', truth: nearest(o, ratio), source: src('RCP7.0', '2030 to 2090'),
      body: () => `<table class="sc"><thead><tr><th>By</th><th>Extra movers</th><th>Share of adults</th></tr></thead><tbody>${ys.map(y => `<tr><td>${y.y}</td><td>${people(y.m3)}</td><td>${y.p.toFixed(2)} %</td></tr>`).join('')}</tbody></table><p>Climate-related moves build up slowly and then speed up, so much of the effect still lies ahead.</p>` }; }
];
function roundFutures() {
  choiceRound({ bridge: FUT_BRIDGE, pts: 100, source: 'CLICME model scenarios, not forecasts · 2090 · adults aged 20–80 · compared with a world without climate change', ...pick(FUTURES)() });
}

// Average score per school from full games. Another school and players without a school are left out.

    a.n++; a.sum += e.s; by.set(e.school, a);

  const list = [...by.values()].map(a => ({ ...a, avg: Math.round(a.sum / a.n) }));
  return {
    ranked: list.filter(a => a.n >= MIN_PLAYERS).sort((x, y) => y.avg - x.avg),
    waiting: list.filter(a => a.n < MIN_PLAYERS).sort((x, y) => y.n - x.n)

}

/* ---------- Rising Water: how sea-level rise becomes uninhabitable land ----------
   Method as described by the team: each 1 km pixel is split into 100 m cells, cells below the new sea level flood,
   and that flooded share of the pixel becomes uninhabitable. Heights are stored in steps of 0.1 m: 0 is water today, 1 means up to 0.1 m.
   The levels W.L are in the same steps. The terrain is an example, not CLICME's own input. */
const W_LAND = ['#FBEFC4', '#E8D48C', '#C3BE6A', '#8FA656', '#5F8F4E'];
const W_BANDS = ['up to 0.5 m', '0.5–1 m', '1–2 m', '2–3 m', 'above 3 m'];
const W_SEA = '#16335E', W_NEW = '#3F9DE3', W_FRONT = '#BFE6FF', W_STEPS = 8;
const W_NOTE = 'An example of the method, not a CLICME result or a forecast for this place. Sea levels here are chosen for illustration. Height data can be off by a metre or more.';
const W_CREDIT = 'Terrain: Copernicus DEM GLO-90, resampled to 100 m, which may differ from the data CLICME uses. © DLR e.V. 2010–2014 and © Airbus Defence and Space GmbH 2014–2018, provided under COPERNICUS by the European Union and ESA; all rights reserved.';
const wBand = b => b <= 5 ? 0 : b <= 10 ? 1 : b <= 20 ? 2 : b <= 30 ? 3 : 4;
const wRGB = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const wMetres = L => '+' + (L / 10).toFixed(1) + ' m';
let W = null;
let WH = null; // heights, decoded once

function wHeights() {
  if (WH) return WH;
  const s = D.coast.s;
  WH = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) WH[i] = s[i] === '~' ? 0 : s.charCodeAt(i) - 47;
  return WH;
}
const wAt = (x, y, cx, cy) => wHeights()[(y * D.coast.km + cy) * D.coast.n + x * D.coast.km + cx];
function wCount(x, y, L) {
  let land = 0, flooded = 0;
  for (let cy = 0; cy < D.coast.km; cy++) for (let cx = 0; cx < D.coast.km; cx++) {
    const h = wAt(x, y, cx, cy);
    if (h) { land++; if (h <= L) flooded++; }
  }
  return { land, flooded, pct: land ? Math.round(flooded / land * 100) : 0 };
}
function wArea(L) {
  let land = 0, flooded = 0;
  for (const h of wHeights()) if (h) { land++; if (h <= L) flooded++; }
  return Math.round(flooded / land * 100);
}
function wOutline(ctx, x, y, size) {
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = Math.max(3, size / 14);
  ctx.strokeRect(x + ctx.lineWidth / 2, y + ctx.lineWidth / 2, size - ctx.lineWidth, size - ctx.lineWidth);
}
// The coast at 100 m, with the newest water drawn brightest so the flood front can be seen moving.
function wFine(cv, L, sel) {
  const n = D.coast.n, S = 720, ctx = cv.getContext('2d');
  if (cv.width !== S) { cv.width = S; cv.height = S; }
  if (!W.off) {
    W.off = document.createElement('canvas'); W.off.width = n; W.off.height = n;
    W.octx = W.off.getContext('2d'); W.img = W.octx.createImageData(n, n);
    W.rgb = { land: W_LAND.map(wRGB), sea: wRGB(W_SEA), fresh: wRGB(W_NEW), front: wRGB(W_FRONT) };
  }
  const H = wHeights(), px = W.img.data, c = W.rgb;
  for (let i = 0; i < H.length; i++) {
    const h = H[i];
    const col = !h ? c.sea : h <= L ? (h > L - 2 ? c.front : c.fresh) : c.land[wBand(h)];
    px[i * 4] = col[0]; px[i * 4 + 1] = col[1]; px[i * 4 + 2] = col[2]; px[i * 4 + 3] = 255;
  }
  W.octx.putImageData(W.img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(W.off, 0, 0, S, S);
  if (sel) { const T = S / D.coast.grid; wOutline(ctx, sel[0] * T, sel[1] * T, T); }
}
// One 1 km pixel, cell by cell. upto: only the first upto cells have been tested so far; mark: the cell under test.
function wCells(cv, x, y, L, upto, mark) {
  const km = D.coast.km, S = 600, T = S / km, ctx = cv.getContext('2d');
  if (cv.width !== S) { cv.width = S; cv.height = S; }
  ctx.clearRect(0, 0, S, S);
  for (let cy = 0; cy < km; cy++) for (let cx = 0; cx < km; cx++) {
    const h = wAt(x, y, cx, cy), k = cy * km + cx, tested = upto == null || k < upto;
    ctx.fillStyle = !h ? W_SEA : (h <= L && tested) ? W_NEW : W_LAND[wBand(h)];
    ctx.fillRect(cx * T, cy * T, T - 3, T - 3);
    if (k === mark) wOutline(ctx, cx * T, cy * T, T - 3);
  }
}
// Every 1 km pixel as a glass: sea today at the bottom, new flood above it, what can still be lived on at the top.
function wTiles(cv, L, sel) {
  const g = D.coast.grid, S = 720, T = S / g, ctx = cv.getContext('2d');
  if (cv.width !== S) { cv.width = S; cv.height = S; }
  ctx.clearRect(0, 0, S, S);
  const cells = D.coast.km * D.coast.km, I = T - 3;
  for (let y = 0; y < g; y++) for (let x = 0; x < g; x++) {
    const c = wCount(x, y, L), sea = (cells - c.land) / cells * I, fl = c.flooded / cells * I;
    ctx.fillStyle = W_LAND[1]; ctx.fillRect(x * T, y * T, I, I);
    ctx.fillStyle = W_NEW; ctx.fillRect(x * T, y * T + I - sea - fl, I, fl);
    ctx.fillStyle = W_SEA; ctx.fillRect(x * T, y * T + I - sea, I, sea);
  }
  if (sel) wOutline(ctx, sel[0] * T, sel[1] * T, I);
}
// Runs f(level) up to a level, unless the player has moved on. Any new action raises W.tok, which stops older animations.
function wRise(from, to, ms, f, done) {
  const tok = ++W.tok;
  if (REDUCED) { f(to); if (done) done(); return; }
  const t0 = performance.now();
  (function frame() {
    if (tok !== W.tok) return;
    const u = Math.min(1, (performance.now() - t0) / ms), L = Math.round(from + (to - from) * u);
    f(L);
    if (u < 1) setTimeout(frame, 40); else if (done) done();
  })();
}
function wSlider(onMove) {
  const s = $('#wl');
  s.value = W.L;
  s.oninput = () => { W.tok++; W.L = +s.value; onMove(W.L); };
}
const wSliderHTML = `<div><div class="bigval" id="wv"></div>
  <input type="range" id="wl" min="0" max="30" step="1" aria-label="Sea-level rise in metres">
  <div class="tick"><span>Today</span><span>+1 m</span><span>+2 m</span><span>+3 m</span></div></div>`;
const wLegend = (...items) => `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const wHeightsLegend = () => `<div class="stack" style="gap:4px"><span class="small">Height above today's sea</span>${wLegend(...W_LAND.map((c, i) => [c, W_BANDS[i]]))}</div>`;
function wPick(cv, draw) {
  cv.onclick = e => {
    const r = cv.getBoundingClientRect(), g = D.coast.grid;
    const x = Math.min(g - 1, Math.floor((e.clientX - r.left) / r.width * g)), y = Math.min(g - 1, Math.floor((e.clientY - r.top) / r.height * g));
    if (!wCount(x, y, 0).land) return;
    W.tok++; W.sel = [x, y]; draw();
  };
}
function wFrame(i, html) {
  W.i = i; W.tok++;
  scrollTo(0, 0);
  $('#top').hidden = false;
  $('#pips').innerHTML = Array.from({ length: W_STEPS }, (_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('');
  $('#score').textContent = i >= 4 ? W.score : '';
  $('#screen').innerHTML = html;
}

// Step 1: the flood itself
function wCoast() {
  wFrame(0, `
    <p class="bridge">Rising Water · ${esc(D.coast.name)}</p>
    <h2>Raise the sea. Which land goes first?</h2>
    <canvas class="map g3d" id="wm" role="img" aria-label="Map of a 12 kilometre square of coast. Water spreads over the land as the sea level rises."></canvas>
    <p class="small" id="wh3" style="text-align:center">Drag sideways to spin. Heights are stretched ${T3_STRETCH} times, or the land would look flat.</p>
    ${wSliderHTML}
    <p class="wsay" id="ws"></p>
    ${wLegend([W_SEA, 'Water today'], [W_NEW, 'Newly flooded'], [W_LAND[0], 'Low land'], [W_LAND[4], 'Higher land'])}
    <button class="btn primary wide" id="wn" type="button">How does the model count this?</button>
    <p class="source">${W_NOTE}</p>`);
  const cv = $('#wm');
  const t3 = terrain3D(cv, 'coast', D.coast.s, { auto: true });
  if (!t3) $('#wh3').hidden = true;
  else document.querySelector('#screen .legend i').style.background = '#1F4E7E'; // the sea as it looks under the 3D water
  const draw = L => { if (t3) t3.level(L); else wFine(cv, L); $('#wv').textContent = wMetres(L); $('#ws').textContent = `${wArea(L)}% of the land in this 12 km square is flooded`; $('#wl').value = L; };
  wSlider(draw);
  $('#wn').onclick = () => wPixel();
  const to = W.L;
  draw(0);
  wRise(0, to, 2600, draw);
}
// Step 2: the test, cell by cell
function wPixel() {

/* ---------- Tiny World: a toy economy that shows the idea behind a general equilibrium model ----------
   Invented numbers, not CLICME. Three places in a line. Income in a place = its strength − 2 × its workers, so more workers mean less for each.
   A person gains by moving if their income in the new place, counting their own arrival, beats what they earn now.
   The world is balanced when nobody can gain. The rule for who cannot move (some cannot pay) is a placeholder for the team to correct. */
const TW_NAMES = ['Coast', 'City', 'Hills'];
const TW_STRENGTH = [30, 38, 22], TW_SLOPE = 2, TW_FLOOD = 12, TW_STUCK = 6, TW_WORKERS = 24;

// The move that would gain the most, or null when the world is balanced
function twBest(L, A, stuck) {
  let best = null;
  for (let i = 0; i < 3; i++) {
    if (twFree(L, stuck, i) <= 0) continue;
    for (let j = 0; j < 3; j++) {
      if (i === j) continue;
      const now = twPay(A, i, L[i]), then = twPay(A, j, L[j] + 1);
      if (then > now && (!best || then - now > best.then - best.now)) best = { i, j, now, then };
    }
  }
  return best;
}
// Fewest button presses from here to a balanced world. Buttons only link neighbouring places.
function twSolve(L0, A, stuck) {
  const seen = new Set([L0.join()]);
  let level = [L0];
  for (let moves = 0; level.length && moves < 60; moves++) {
    const next = [];
    for (const L of level) {
      if (!twBest(L, A, stuck)) return { moves, L };
      for (const [f, t] of [[0, 1], [1, 0], [1, 2], [2, 1]]) {
        if (twFree(L, stuck, f) <= 0) continue;
        const M = L.slice(); M[f]--; M[t]++;

    rect('#E8D48C', 20, GY, 40, H - GY); rect('#FBEFC4', 20, GY, 40, 1);
    rect('#E8D48C', 17, GY + 6, 3, H); rect('#E8D48C', 14, GY + 16, 3, H);
    // City: buildings with lit windows

  document.querySelectorAll('#pc .btn').forEach(b => {
    b.onclick = () => {
      if (b.dataset.iso === 'LUX') return paintRound('Luxembourg', D.lux.map, `Luxembourg gains about ${people(D.lux.m1)} adults overall in this scenario.`);
      if (b.dataset.iso === 'CARIB') return paintRound('The Caribbean', D.carib, 'A whole region at once. Pixels only exist where people live, so the sea stays empty.');
      const c = D.pool.find(p => p.iso === b.dataset.iso);

function paintRound(name, lv, note) {
  const S = 768, step = S / lv.n, ox = (S - lv.c * step) / 2, oy = (S - lv.r * step) / 2, gap = lv.n <= 16 ? 3 : 0, cells = [];
  for (let i = 0; i < lv.s.length; i++) if (lv.s[i] !== '.') cells.push(i);
  const mine = new Uint8Array(lv.s.length);
  let brush = P_BLUE, painted = 0, finished = false;
  plainFrame(`
    <p class="bridge">Paint the Map · ${esc(name)}</p>
    <h2 id="ph">Paint blue where adults arrive, orange where they leave</h2>
    <canvas class="map paintmap" id="pv" role="img" aria-label="Blank pixel outline of ${esc(name)} to paint on"></canvas>
    <div id="pc" class="stack">
      <div class="brushes">
        <button class="btn on" id="pb" type="button" aria-pressed="true"><i style="background:${COL[5]}"></i>More adults</button>
        <button class="btn" id="po" type="button" aria-pressed="false"><i style="background:${COL[1]}"></i>Fewer adults</button>
      </div>
      <p class="wtest" id="pn" aria-live="polite"></p>
      <div class="grid2"><button class="btn" id="pf" type="button">Fill the rest</button><button class="btn" id="pz" type="button">Start over</button></div>
      <button class="btn primary wide big" id="pr" type="button" disabled>Reveal the real map</button>
    </div>
    <div id="pa" class="stack"></div>`);
  const cv = $('#pv'), ctx = cv.getContext('2d');
  cv.width = S; cv.height = S;
  const cell = (i, col) => {
    const x = i % lv.c, y = (i - x) / lv.c;
    ctx.fillStyle = col;
    ctx.fillRect(ox + x * step, oy + y * step, Math.ceil(step) - gap, Math.ceil(step) - gap);
  };
  const myCol = i => mine[i] === P_BLUE ? COL[5] : mine[i] === P_ORANGE ? COL[1] : P_EMPTY;
  cells.forEach(i => cell(i, P_EMPTY));
  const status = () => {
    const pct = Math.round(painted / cells.length * 100);
    $('#pn').textContent = painted ? `${pct}% painted` : 'Drag your finger across the map.';
    $('#pr').disabled = pct < 25;
    $('#pr').textContent = pct < 25 ? 'Paint at least a quarter first' : 'Reveal the real map';
  };
  const dab = (px, py) => {
    const cx = (px - ox) / step, cy = (py - oy) / step, r = Math.max(.75, lv.n * .05);
    for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(lv.r - 1, Math.floor(cy + r)); y++) {
      for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(lv.c - 1, Math.floor(cx + r)); x++) {
        const i = y * lv.c + x;
        if (lv.s[i] === '.' || Math.hypot(x + .5 - cx, y + .5 - cy) > r || mine[i] === brush) continue;
        if (!mine[i]) painted++;
        mine[i] = brush;
        cell(i, myCol(i));
      }
    }
  };
  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * S, (e.clientY - r.top) / r.height * S]; };
  let last = null;
  cv.addEventListener('pointerdown', e => {
    if (finished) return;
    last = at(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic event */ }
    dab(last[0], last[1]); status();
  });
  cv.addEventListener('pointermove', e => {
    if (!last || finished) return;
    // Fills the gap between two touch points, so a fast stroke leaves no holes
    const p = at(e), d = Math.hypot(p[0] - last[0], p[1] - last[1]), n = Math.ceil(d / (step * .6)) || 1;
    for (let k = 1; k <= n; k++) dab(last[0] + (p[0] - last[0]) * k / n, last[1] + (p[1] - last[1]) * k / n);
    last = p; status();
  });
  const stop = () => { last = null; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  const pickBrush = b => {
    brush = b;
    $('#pb').classList.toggle('on', b === P_BLUE); $('#po').classList.toggle('on', b === P_ORANGE);
    $('#pb').setAttribute('aria-pressed', b === P_BLUE); $('#po').setAttribute('aria-pressed', b === P_ORANGE);
    $('#pf').textContent = `Fill the rest ${b === P_BLUE ? 'blue' : 'orange'}`;
  };
  $('#pb').onclick = () => pickBrush(P_BLUE);
  $('#po').onclick = () => pickBrush(P_ORANGE);
  $('#pf').onclick = () => { cells.forEach(i => { if (!mine[i]) { mine[i] = brush; painted++; cell(i, myCol(i)); } }); status(); };
  $('#pz').onclick = () => { mine.fill(0); painted = 0; cells.forEach(i => cell(i, P_EMPTY)); status(); };
  pickBrush(P_BLUE); status();

  $('#pr').onclick = () => {
    finished = true;
    cv.setAttribute('aria-label', `Pixel map of ${name}. Orange places lose adults, blue places gain them.`);
    $('#pc').hidden = true;
    $('#ph').textContent = 'The real map';
    let right = 0, scored = 0, blue = 0, orange = 0;
    cells.forEach(i => {
      const t = pTruth(lv.s[i]);
      if (!t) return;
      scored++;
      if (t === P_BLUE) blue++; else orange++;
      if (mine[i] === t) right++;
    });
    const score = Math.round(right / scored * 100), flat = Math.round(Math.max(blue, orange) / scored * 100), flatName = blue >= orange ? 'blue' : 'orange';
    const views = {
      yours: i => myCol(i),
      real: i => COL[+lv.s[i]],
      match: i => { const t = pTruth(lv.s[i]); return !t ? COL[3] : mine[i] === t ? '#F2F5FA' : '#7A2E3A'; }
    };
    const showView = v => {
      ctx.clearRect(0, 0, S, S);
      cells.forEach(i => cell(i, views[v](i)));
      document.querySelectorAll('#pt .btn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
      $('#ph').textContent = { real: 'The real map', yours: 'Your map', match: 'Where you were right' }[v];
      $('#pl').innerHTML = v === 'match'
        ? `<span><i style="background:#F2F5FA"></i>You got it right</span><span><i style="background:#7A2E3A"></i>You got it wrong</span><span><i style="background:${COL[3]}"></i>Little change, not scored</span>`
        : `<span><i style="background:${COL[5]}"></i>More adults</span><span><i style="background:${COL[1]}"></i>Fewer adults</span>${v === 'real' ? `<span><i style="background:${COL[3]}"></i>Little change</span>` : ''}`;
    };
    const finish = () => {
      if (!cv.isConnected) return;
      const beat = score > flat || score === 100;
      $('#pa').innerHTML = `
        <div class="tabs" id="pt"><button class="btn tab" type="button" data-v="real">Real map</button><button class="btn tab" type="button" data-v="yours">Your map</button><button class="btn tab" type="button" data-v="match">Right or wrong</button></div>
        <div class="legend" id="pl"></div>
        <div class="reveal ${beat ? 'good' : 'miss'}">
          <div class="verdict"><span>You matched</span><b><span id="ps">${score}</span>%</b></div>
          <p>${flat === 100 ? `Every pixel here turns ${flatName} in this scenario, so one colour was the whole answer.` : `Painting it all ${flatName} would have matched ${flat}%. ${beat ? 'You beat that.' : score === flat ? 'You matched that.' : 'Can you beat that?'}`}</p>
          <p>${esc(note)}</p>
        </div>
        ${badgeHTML('paint', 'Map Painter')}
        <button class="btn primary wide" id="pp" type="button">Paint another place</button>
        ${nextMenu('paint')}
        <p class="source">${SOURCE}. The score only compares more or fewer adults, and leaves out places with little change.</p>`;
      document.querySelectorAll('#pt .btn').forEach(b => { b.onclick = () => showView(b.dataset.v); });
      showView('real');
      $('#pp').onclick = paintMap;
      wireNext();
      countUp($('#ps'), 0, score, 800);
      if (beat) pixelBurst($('#pa'));
    };
    if (REDUCED) { cells.forEach(i => cell(i, COL[+lv.s[i]])); finish(); return; }
    // The real map sweeps across the drawing, one column of pixels at a time
    let col = 0;
    const perFrame = Math.max(1, Math.ceil(lv.c / 40));
    (function sweep() {
      if (!cv.isConnected) return;
      for (const end = Math.min(lv.c, col + perFrame); col < end; col++) {
        for (let y = 0; y < lv.r; y++) { const i = y * lv.c + col; if (lv.s[i] !== '.') cell(i, COL[+lv.s[i]]); }
      }
      if (col < lv.c) setTimeout(sweep, 35); else setTimeout(finish, 200);
    })();
  };
}

/* ---------- Caribbean Shifts: five questions on the Greater Caribbean ----------
   Figures: Great Caribbean Shifts report and fact sheet (2025, Global Centre for Climate Mobility), with modelling by CIESIN and LISER. The explorer offers no download, so only published region-wide figures are used.

const CB_SRC = 'Great Caribbean Shifts (2025), Global Centre for Climate Mobility. Modelling by CIESIN at Columbia University and LISER. Pessimistic "Rocky Road" scenario (SSP3–RCP7.0), by 2050, not a forecast.';

  { kind: 'people', q: 'Up to 8.2 million people could be forced to move for good by 2050. Picture 100 of them. How many end up in another country?', min: 0, max: 100, step: 5, start: 50, truth: 30, score: g => Math.max(0, 100 - 2 * Math.abs(g - 30)), said: g => `You said ${g}.`,

  { kind: 'choice', q: 'In which country does sea-level rise cause almost all climate moves?', opts: ['The Bahamas', 'Colombia', 'Mexico', 'Costa Rica'], truth: 'The Bahamas',
    title: 'The Bahamas: 95%', body: () => '<p>It is about 60% in Suriname and Belize. Across the whole region, though, about 80% of climate displacement comes from rising temperatures and disasters.</p>', src: CB_SRC },
  { kind: 'choice', q: 'Climate also damages the places people might move to. What does that do?', opts: ['It pushes even more people to leave', 'It holds millions of people back', 'It changes very little'], truth: 'It holds millions of people back',
    title: 'It holds millions back', body: () => '<p>About 6 million people who might otherwise have moved could stay put as jobs and wages get worse in the places they would go. Without support to adapt, they could face growing climate risk.</p>', src: CB_SRC }

/* ---------- Fact or Fiction: ten quick swipes ----------
   Statements come from two places: Yann Marx's "Climate Change: Migration and Inequality" slides (src names the paper cited there), and the CLICME tables.

const FF_LIT = [
  { text: 'The richest 1% of people emit as much CO₂ as the poorest two-thirds of humanity.', fact: true, why: 'Measured by what people consume, in 2019. The richest 10% produce about half of all emissions.', src: 'Oxfam & SEI (2023), Climate Equality; Chancel (2022), Nature Sustainability' },

  { text: 'Rich countries pay most of the costs of climate change.', fact: false, why: 'Developing countries bear 78% of the costs, with 81% of the people but only 36% of world income.', src: 'Busch (2015), Center for Global Development; costs from the RICE model, for 2015' },
  { text: 'Lifting over a billion people out of poverty would send world CO₂ soaring.', fact: false, why: 'It would add about 1.6–2.1%. The richest 1% alone produce about 16% of emissions.', src: 'Bruckner et al. (2022), Nature Sustainability; Oxfam & SEI (2023)' },

  { text: 'Fast emission cuts and inclusive development could cut internal climate migration by up to 80%.', fact: true, why: 'The future is not fixed. The World Bank finds these choices could make a difference that large.', src: 'Clement et al. (2021), World Bank Groundswell' },

const ffClicme = () => [
  { text: 'By 2090, most adults in the world move because of climate change.', fact: false, why: `About ${D.wh.share.toFixed(1)} in every 100 do in this scenario. Most people stay.`, src: SOURCE },

const FF_ROUNDS = 10, FF_FROM_CLICME = 4;
function factOrFiction() {
  const list = shuffle([...shuffle(FF_LIT).slice(0, FF_ROUNDS - FF_FROM_CLICME), ...shuffle(ffClicme()).slice(0, FF_FROM_CLICME)]);

  plainFrame(`
    <p class="bridge">Fact or Fiction</p>

      <div class="grid2" id="fb"><button class="btn" id="ffn" type="button">Fiction</button><button class="btn" id="ffy" type="button">Fact</button></div>

    const card = $('#fc');
    let x0 = null;
    card.addEventListener('pointerdown', e => { if (!answered) { x0 = e.clientX; try { card.setPointerCapture(e.pointerId); } catch (err) { /* synthetic event */ } } });
    card.addEventListener('pointermove', e => { if (x0 != null && !answered) { const dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; } });
    card.addEventListener('pointerup', e => {
      if (x0 == null || answered) return;
      const dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 70) answer(dx > 0); else card.style.transform = '';
    });
    card.addEventListener('pointercancel', () => { x0 = null; card.style.transform = ''; });
  };
  const end = () => {
    const title = score >= 9 ? 'Myth Buster' : score >= 6 ? 'Sharp Sceptic' : 'Fact Hunter';
    $('#pips').innerHTML = list.map(() => '<i class="done"></i>').join('');
    scrollTo(0, 0);
    $('#ff').innerHTML = `
      <div class="stack" style="gap:4px"><div class="final"><span id="fsc">${score}</span><small> / ${list.length}</small></div><div class="rank">${title}</div></div>
      ${badgeHTML('fact', title)}
      ${best > 1 ? `<p>Your best streak: ${best} in a row.</p>` : ''}
      ${wrong.length ? `<h2>The ones that fooled you</h2><ul class="fflist">${wrong.map(q => `<li><b>${esc(q.text)}</b>${q.fact ? 'It was a fact.' : 'It was fiction.'}</li>`).join('')}</ul>` : '<p>Nothing fooled you.</p>'}
      ${nextMenu('fact')}
      <button class="btn wide" id="ffa" type="button">Play again</button>`;
    countUp($('#fsc'), 0, score, 700);
    if (score >= 6) pixelBurst($('.final'));
    wireNext();
    $('#ffa').onclick = factOrFiction;
  };
  ask();
}

/* ---------- Climate Detective: read the towers, spin the globe, tap the country ----------
   Every answer is worked out from the CLICME country tables for RCP7.0, 2090. Only countries large enough to tap can be answers. */
const DET_CASES = [
  { con: 'Africa', q: 'In Africa, which country loses the most adults?', val: c => -c.v[3], show: c => signed(c.v[3]) },
  { con: 'Asia', q: 'In Asia, which country loses the most adults?', val: c => -c.v[3], show: c => signed(c.v[3]) },
  { con: 'Europe', q: 'In Europe, which country gains the most adults?', val: c => c.v[3], show: c => signed(c.v[3]) },
  { con: 'South America', q: 'In South America, which country gains the most adults?', val: c => c.v[3], show: c => signed(c.v[3]) },
  { con: 'North America', q: 'In North America, which country gains the most adults?', val: c => c.v[3], show: c => signed(c.v[3]) },
  { con: 'Asia', q: 'In Asia, where does sea-level rise push out the most adults?', val: c => c.hz[2], show: c => people(c.hz[2]) },
  { con: 'Africa', q: 'In Africa, where does sea-level rise push out the most adults?', val: c => c.hz[2], show: c => people(c.hz[2]) },
  { con: 'Europe', q: 'In Europe, where do floods push out the most adults?', val: c => c.hz[1], show: c => people(c.hz[1]) },
  { con: 'Asia', q: 'In Asia, where do floods push out the most adults?', val: c => c.hz[1], show: c => people(c.hz[1]) },
  { con: 'Africa', q: 'In Africa, where does temperature push out the most adults?', val: c => c.hz[0], show: c => people(c.hz[0]) },
  { con: 'South America', q: 'In South America, where does sea-level rise push out the most adults?', val: c => c.hz[2], show: c => people(c.hz[2]) }
];
const DET_CENTRE = { Africa: [4, 20], Asia: [30, 92], Europe: [50, 14], 'South America': [-16, -60], 'North America': [40, -98] };
const DET_ROUNDS = 5, DET_POINTS = [100, 60, 30], DET_ZOOM = { Africa: 2.9, Asia: 3.1, Europe: 2.3, 'South America': 2.8, 'North America': 3 }, DET_MIN_PATCHES = 3;
function detAnswer(cs) {
  const pool = D.globe.countries.map((c, k) => ({ ...c, id: k + 1 })).filter(c => c.c === cs.con && c.p >= DET_MIN_PATCHES);
  const ranked = pool.slice().sort((a, b) => cs.val(b) - cs.val(a));
  return { pool, ranked, truth: ranked[0] };
}
function detKm(a, b) {
  const R = Math.PI / 180, x = Math.sin((b.lat - a.lat) * R / 2) ** 2 + Math.cos(a.lat * R) * Math.cos(b.lat * R) * Math.sin((b.lon - a.lon) * R / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(x));
}
function climateDetective() {
  const cases = shuffle(DET_CASES).slice(0, DET_ROUNDS);
  let i = 0, score = 0, tries = 0, chosen = 0, cur = null, closed = false;
  plainFrame(`
    <p class="bridge">Climate Detective · case <span id="dn"></span> of ${DET_ROUNDS}</p>
    <h2 id="dq"></h2>
    <canvas class="map g3d space" id="dm" role="img" aria-label="A globe of towers. Blue towers gain adults by 2090, orange towers lose them. Spin it and tap a country."></canvas>
    <p class="gpick" id="dt" aria-live="polite"></p>
    <div id="dopts" class="grid2" hidden></div>
    <button class="btn primary wide" id="da" type="button" disabled>Tap a country</button>
    <p class="wtest" id="dh" aria-live="polite"></p>
    <div id="dr" class="stack"></div>
    <div class="legend"><span><i style="background:${COL[5]}"></i>More adults</span><span><i style="background:${COL[1]}"></i>Fewer adults</span><span><i style="background:#FFD34D"></i>Your pick</span></div>
    <p class="source">${SOURCE}. Towers show net change per patch, and borders are approximate. Answers come from the CLICME country tables, among countries large enough to tap.</p>`);
  const pick = id => {
    if (closed || !cur) return;
    const c = id > 0 ? D.globe.countries[id - 1] : null;
    if (!c) { chosen = 0; if (g) g.mark(0, 0); $('#dt').textContent = id === 0 ? 'Few people live there. Try another spot.' : ''; $('#da').disabled = true; $('#da').textContent = 'Tap a country'; return; }
    chosen = id;
    if (g) g.mark(id, 0);
    $('#dt').textContent = c.n;
    $('#da').disabled = false;
    $('#da').textContent = `Accuse ${c.n}`;
  };
  const g = globe3D($('#dm'), { t: 3, onPick: pick });
  if (!g) $('#dm').hidden = true;
  const start = () => {
    if (i >= cases.length) return finish();
    const cs = cases[i];
    cur = { cs, ...detAnswer(cs) };
    tries = 0; chosen = 0; closed = false;
    $('#dn').textContent = i + 1;
    $('#dq').textContent = cs.q;
    $('#dt').textContent = ''; $('#dh').textContent = ''; $('#dr').innerHTML = '';
    $('#da').hidden = false; $('#da').disabled = true; $('#da').textContent = 'Tap a country';
    $('#pips').innerHTML = cases.map((_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('');
    $('#score').textContent = score;
    scrollTo(0, 0);
    if (g) {
      g.mark(0, 0);
      const [lat, lon] = DET_CENTRE[cs.con];
      g.look(lat, lon, DET_ZOOM[cs.con]);
    } else {
      // Without 3D: four choices from the same continent, always including the answer
      const others = shuffle(cur.pool.filter(c => c.id !== cur.truth.id)).slice(0, 3), opts = $('#dopts');
      opts.hidden = false;
      opts.innerHTML = shuffle([cur.truth, ...others]).map(c => `<button class="btn" type="button" data-id="${c.id}">${esc(c.n)}</button>`).join('');
      opts.querySelectorAll('.btn').forEach(b => { b.onclick = () => pick(+b.dataset.id); });
    }
  };
  const solve = good => {
    closed = true;
    const p = good ? DET_POINTS[tries] : 0, t = cur.truth, top = cur.ranked.slice(0, 3).filter(c => cur.cs.val(c) > 0), sign = t.v[3] < 0 && cur.cs.val(t) === -t.v[3] ? -1 : 1;
    countUp($('#score'), score, score + p);
    score += p;
    if (g) { g.mark(0, t.id); g.look(t.lat, t.lon, DET_ZOOM[cur.cs.con]); }
    $('#dt').textContent = t.n;
    $('#da').hidden = true; $('#dh').textContent = '';
    if (!g) $('#dopts').hidden = true;
    $('#dr').innerHTML = `<div class="reveal ${good ? 'good' : 'miss'}"><div class="verdict"><span>${good ? `Yes, ${esc(t.n)}!` : `It was ${esc(t.n)}`}</span><b>+${p}</b></div>
      ${barsHTML(top.map(c => ({ label: c.n, v: sign * cur.cs.val(c), t: cur.cs.show(c) })))}</div>
      <button class="btn primary wide" id="dx" type="button">${i + 1 < cases.length ? 'Next case' : 'See my score'}</button>`;
    if (good) pixelBurst($('#dr'));
    $('#dx').onclick = () => { i++; start(); };
    $('#dr').scrollIntoView({ block: 'nearest' });
  };
  $('#da').onclick = () => {
    if (closed || !chosen) return;
    const t = cur.truth;
    if (chosen === t.id) return solve(true);
    tries++;
    if (tries >= DET_POINTS.length) return solve(false);
    const c = D.globe.countries[chosen - 1], km = Math.round(detKm(c, t) / 100) * 100;
    $('#dh').textContent = tries === 1
      ? `Not ${c.n}. You are about ${km.toLocaleString('en-GB')} km away.`
      : `Not ${c.n}. About ${km.toLocaleString('en-GB')} km away, and its name starts with ${t.n[0]}.`;
    chosen = 0;
    if (g) g.mark(0, 0);
    $('#dt').textContent = ''; $('#da').disabled = true; $('#da').textContent = 'Tap a country';
  };
  const finish = () => {
    const max = DET_ROUNDS * DET_POINTS[0], title = score >= max * .8 ? 'Chief Detective' : score >= max * .4 ? 'Climate Detective' : 'Junior Detective';
    plainFrame(`
      <div class="stack" style="gap:4px"><div class="final"><span id="fsc">${score}</span><small> / ${max}</small></div><div class="rank">${title}</div></div>
      ${badgeHTML('detective', title)}
      <h2>Now watch the whole map change</h2>
      ${globePanelHTML()}
      ${nextMenu('detective')}
      <button class="btn wide" id="dz" type="button">Play again</button>`);
    countUp($('#fsc'), 0, score, 800);
    if (score >= max * .4) pixelBurst($('.final'));
    wireNext();
    globePanelWire();
    $('#dz').onclick = climateDetective;
  };
  window.__det = { get cur() { return cur; }, get g() { return g; }, pick }; // for the automated tests, to go with the #dev hooks at launch
  start();
}

/* ---------- boot; #dev-… hashes jump to a screen for layout checks ---------- */

} else if (location.hash === '#caribbean') {

} else if (location.hash === '#fact') {

} else if (location.hash === '#detective') {

} else if (location.hash === '#paint') {

} else if (location.hash === '#globe') {

} else if (location.hash === '#draw') {

} else if (/^#who(-[0-2])?$/.test(location.hash)) {

} else if (/^#tiny(-[0-3])?$/.test(location.hash)) {

} else if (/^#water(-\d)?$/.test(location.hash)) {

} else if (location.hash === '#dev-form') { setupScreen(FULL); $('#prize').open = true;
} else { startScreen(); }
})();
</script>
